<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fourtune Design - Login</title>
    <link rel="stylesheet" href="../assets/css/login_page.css" />
    <style>
        body {
            margin: auto;
            max-width: 100%;
            background-color: #f7fafd;
        }
    </style>
</head>

<body>
    <div class="login-section">
        <div class="login-box">
            <img src="/assets/images/FourtuneDesign.png" alt="Logo">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button onclick="loginUser()">Login</button>
            <p>Don't have an account?</p>
            <a href="register.html">
               Register
            </a>
            <button onclick="logoutUser()" id="logoutBtn" style="display:none;background:#999;">
                Logout
            </button>
            <div class="message" id="message"></div>
        </div>
    </div>
    <footer>
        © 2026 Fourtune Design. All Rights Reserved.
    </footer>
    <script>
        window.onload = function () {
            let user = JSON.parse(localStorage.getItem("user"));
            if (user) {
                document.getElementById("message").innerHTML =
                    "Already logged in as <b>" + user.name + "</b>";
                document.getElementById("logoutBtn").style.display = "block";
            }
        }
        function loginUser() {
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value.trim();
            let message = document.getElementById("message");
            let users = JSON.parse(localStorage.getItem("users")) || [];
            let found = false;
            for (let i = 0; i < users.length; i++) {
                if (users[i].email == email && users[i].password == password) {
                    localStorage.setItem("user", JSON.stringify(users[i]));
                    found = true;
                    break;
                }
            }
            if (found) {
                message.innerHTML = "Login Successful!";
                document.getElementById("logoutBtn").style.display = "block";
                window.location.href = "/pages/home.html";
            } else {
                message.innerHTML = "Invalid email or password.";
            }
        }
        function logoutUser() {
            localStorage.removeItem("user");
            document.getElementById("message").innerHTML = "Logged out.";
            document.getElementById("logoutBtn").style.display = "none";
        }
    </script>
</body>

</html>
