<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>My Bookings</title>
    <link rel="stylesheet" href="../assets/css/home_page.css" />
    <link rel="stylesheet" href="../assets/css/bookings.css" />

</head>
<body>
    <nav class="navbar">
        <a href="/pages/home.html">
            <div class="logo">
                <div class="top-logo">FourTune</div>
                <div class="down-logo"> Decoration</div>
            </div>
        </a>
        <div class="right-nav">
            <li><a href="/pages/contact.html">About Us</a></li>
            <li id="booking-link"></li>
            <li id="authItem">
                <a href="/pages/login.html">
                    <button class="login">Login →</button>
                </a>
            </li>
        </div>
    </nav>

<div class="bookings-section">
    <div class="bookings-box">
        <h2>My Bookings</h2>

        <div id="bookingList"></div>
    </div>
</div>

<script>
    const bookings = JSON.parse(localStorage.getItem("bookings")) || [];

const bookingList = document.getElementById("bookingList");

if (bookings.length === 0) {
    bookingList.innerHTML = "<h3>No bookings found.</h3>";
}
else {

    bookings.forEach((booking, index) => {

    bookingList.innerHTML += `
        <div class="booking-card">

            <img src="${booking.productImg}" alt="${booking.productName}">

            <div class="booking-info">
                <h3>${booking.productName}</h3>

                <p><strong>Price:</strong> Rs. ${booking.productPrice}</p>
                <p><strong>Name:</strong> ${booking.customerName}</p>
                <p><strong>Email:</strong> ${booking.customerEmail}</p>
                <p><strong>Phone:</strong> ${booking.customerPhone}</p>
                <p><strong>Event Date:</strong> ${booking.eventDate}</p>
                <p><strong>Location:</strong> ${booking.eventLocation}</p>
                <p><strong>Requirements:</strong> ${booking.specialRequirements}</p>

                <button onclick="cancelBooking(${index})">
                    Cancel Booking
                </button>
            </div>

        </div>
    `;
});
}

function cancelBooking(index) {

    let bookings = JSON.parse(localStorage.getItem("bookings")) || [];

    bookings.splice(index, 1);

    localStorage.setItem("bookings", JSON.stringify(bookings));

    location.reload();
}
</script>

</body>
</html>
